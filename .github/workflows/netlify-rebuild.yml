name: Netlify build (dagelijks en ad hoc)

# Buildtegoed sparen: hooguit één productiebuild per dag, alleen als er iets veranderd is.
# 1. schedule: elke dag om 05:00 UTC (06:00 wintertijd, 07:00 zomertijd).
#    Bouwt alleen als er in de afgelopen 25 uur:
#    - iets is gepubliceerd in Sanity (post, category, author, legalPage, pagina), of
#    - een ingepland artikel live is gegaan (publishedAt verstreken), of
#    - een commit op main is gedaan (Lovable, Claude).
# 2. workflow_dispatch: ad hoc bouwen via Actions > deze workflow > "Run workflow". Bouwt altijd.
# Netlify slaat alle andere builds over (zie scripts/netlify-ignore.sh), behalve deploy previews.
# Niet gedetecteerd: een document dat alleen is gedepubliceerd of verwijderd. Gebruik dan de ad-hocknop.
# Benodigd secret: NETLIFY_BUILD_HOOK (de URL van de Netlify build hook).

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

concurrency:
  group: netlify-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Controleren of er iets veranderd is
        id: check
        if: github.event_name == 'schedule'
        run: |
          SINCE=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Controle vanaf $SINCE (UTC)"

          CODE=$(git log --since="$SINCE" --oneline | wc -l | tr -d ' ')
          echo "Commits op main: $CODE"

          Q='count(*[_type in ["post","category","author","legalPage","pagina"] && !(_id in path("drafts.**")) && !(_id in path("versions.**")) && (dateTime(_updatedAt) > dateTime($since) || (_type == "post" && dateTime(publishedAt) > dateTime($since) && dateTime(publishedAt) <= dateTime(now())))])'
          CONTENT=$(curl -sf -G "https://h53ofne2.api.sanity.io/v2024-01-01/data/query/production" \
            --data-urlencode "perspective=published" \
            --data-urlencode "query=$Q" \
            --data-urlencode "\$since=\"$SINCE\"" | jq -r '.result')
          echo "Gewijzigde of live gegane Sanity-documenten: $CONTENT"

          if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
            echo "Sanity-controle mislukt: voor de zekerheid bouwen."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$CODE" != "0" ] || [ "$CONTENT" != "0" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Niets veranderd: geen build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Netlify-build starten
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.build == 'true'
        run: |
          curl -sf -X POST -d '{}' "$HOOK" -o /dev/null -w "Netlify build hook: %{http_code}\n"
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
