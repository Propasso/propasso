[build]
  # Build-time prerendering: na vite build rendert scripts/prerender.mjs elke pagina
  # naar statische HTML. puppeteer wordt los geïnstalleerd (niet in package.json),
  # zodat Lovable er niets van merkt. Zie roadmap.md, "Prerendering".
  command = "npm run build && npm install --prefix scripts/.prerender-deps --no-save --no-package-lock --no-audit --no-fund puppeteer@25.12.0 && node scripts/prerender.mjs"
  publish = "dist"

# routing moet als eerste draaien (vóór prerender): 301's en echte 404's
[[edge_functions]]
  path = "/*"
  excludedPath = ["/assets/*", "/og/*", "/favicon.*", "/*.png", "/*.svg", "/*.txt", "/sitemap.xml", "/netlify-prerender-function"]
  function = "routing"

[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

# ---- 301-doorverwijzingen ----
# Staan in netlify/edge-functions/routing.ts, niet hier: redirects in dit
# bestand draaien pas na de prerender-middleware en bots zien ze dan niet.

# ---- Oude WordPress-paden: 410 Gone ----

[[redirects]]
  from = "/wp-includes/*"
  to = "/410"
  status = 410

[[redirects]]
  from = "/wp-content/*"
  to = "/410"
  status = 410

# ---- SPA rewrites: bestaande routes geven 200 ----
# Geprerenderde pagina's (bijv. dist/werkwijze.html) gaan vóór deze regels (shadowing).
# Bestaat er (nog) geen statisch bestand, dan krijgt de bezoeker de lege app.

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

