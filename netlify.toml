[build]
  command = "npm run build"
  publish = "dist"

[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

# ---- 301 redirects (oude URL's) ----

[[redirects]]
  from = "/over-mij"
  to = "/over-propasso"
  status = 301

[[redirects]]
  from = "/over-mij/"
  to = "/over-propasso"
  status = 301

[[redirects]]
  from = "/diensten"
  to = "/werkwijze"
  status = 301

[[redirects]]
  from = "/diensten/"
  to = "/werkwijze"
  status = 301

[[redirects]]
  from = "/partnernetwerk"
  to = "/over-propasso"
  status = 301

[[redirects]]
  from = "/onewebmedia/Algemene*"
  to = "/algemene-voorwaarden"
  status = 301

[[redirects]]
  from = "/onewebmedia/Privacyverklaring*"
  to = "/privacyverklaring"
  status = 301

[[redirects]]
  from = "/ben-je-klaar-om-te-verkopen-twee-vormen-van-exit-readiness-die-je-moet-begrijpen/"
  to = "/kennisbank/wanneer-is-je-bedrijf-verkoopklaar-over-voorbereiding-van-bedrijf-en-ondernemer"
  status = 301

# ---- Oude WordPress-paden: 410 Gone ----

[[redirects]]
  from = "/wp-includes/*"
  to = "/410"
  status = 410

[[redirects]]
  from = "/wp-content/*"
  to = "/410"
  status = 410

# ---- SPA rewrites: bestaande routes geven 200 ----

